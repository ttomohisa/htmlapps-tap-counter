# A merge to main creates a push event. Publish once per SemVer tag.
# Build unprivileged; only the publication job receives a write token.
name: Publish GitHub Release
'on':
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tap-counter-versioned-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "app.config.json must contain a valid SemVer version, got: $version"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Build and verify release HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: tap-counter-release-assets
          path: |
            dist/index.html
            dist/index.self-extract.html
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tap-counter-release-assets
          path: release-assets
      - name: Publish tag and GitHub Release if new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/index.html
          test -s release-assets/index.self-extract.html

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          # If a tag exists without a release, do not silently publish another commit under it.
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [ "$tag_sha" != "$TARGET_SHA" ]; then
              echo "::error::Existing $TAG points to $tag_sha, not $TARGET_SHA."
              exit 1
            fi
            echo "Existing tag $TAG matches the commit; completing its release."
          fi

          gh release create "$TAG" \
            "release-assets/index.html#tap-counter.html" \
            "release-assets/index.self-extract.html#tap-counter.self-extract.html" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Tap Counter $TAG" \
            --generate-notes
